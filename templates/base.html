<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Tracker</title>

    <!-- Bootstrap stylesheet -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom stylesheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <header>
    </header>

    <!-- Main navigation -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom">
        <div class="container-fluid px-3 px-lg-5">
            <!-- Desktop title -->
            <a class="navbar-brand fw-semibold d-none d-lg-block" href="{{ url_for('dashboard') }}">
                Job Application Tracker
            </a>

            <!-- Mobile hamburger button -->
            <button class="navbar-toggler d-lg-none" type="button" data-bs-toggle="offcanvas"
                data-bs-target="#mobileMenu" aria-controls="mobileMenu" aria-label="Open navigation menu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Navigation links -->
            <div class="offcanvas-lg offcanvas-start ms-lg-auto" tabindex="-1" id="mobileMenu"
                aria-labelledby="mobileMenuLabel">

                <div class="offcanvas-header">
                    <h5 class="offcanvas-title" id="mobileMenuLabel">
                        Job Application Tracker
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" data-bs-target="#mobileMenu"
                        aria-label="Close menu"></button>
                </div>

                <div class="offcanvas-body">
                    <div class="navbar-nav gap-lg-3">
                        <a class="nav-link px-3 {% if request.endpoint == 'dashboard' %}active bg-body-secondary rounded{% endif %}"
                            href="{{ url_for('dashboard') }}">Dashboard</a>

                        <a class="nav-link px-3 {% if request.endpoint in ['companies', 'company_detail'] %}active bg-body-secondary rounded{% endif %}"
                            href="{{ url_for('companies') }}">Companies</a>

                        <a class="nav-link px-3 {% if request.endpoint in ['jobs', 'job_detail'] %}active bg-body-secondary rounded{% endif %}"
                            href="{{ url_for('jobs') }}">Jobs</a>

                        <a class="nav-link px-3 {% if request.endpoint in ['applications', 'application_detail'] %}active bg-body-secondary rounded{% endif %}"
                            href="{{ url_for('applications') }}">Applications</a>

                        <a class="nav-link px-3 {% if request.endpoint in ['contacts', 'contact_detail'] %}active bg-body-secondary rounded{% endif %}"
                            href="{{ url_for('contacts') }}">Contacts</a>

                        <a class="nav-link px-3 {% if request.endpoint == 'job_match' %}active bg-body-secondary rounded{% endif %}"
                            href="{{ url_for('job_match') }}">Job Match</a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main page content -->
    <main class="container-fluid px-3 px-lg-5 py-4">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
