<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Tracker</title>

    <!-- Bootstrap stylesheet -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom stylesheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <header>
    </header>

    <!-- Main navigation -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom">
        <div class="container-fluid px-3 px-lg-5">
            <!-- Desktop title -->
            <a class="navbar-brand fw-semibold d-none d-lg-block" href="{{ url_for('dashboard') }}">
                Job Application Tracker
            </a>

            <!-- Mobile hamburger button -->
            <button class="navbar-toggler d-lg-none" type="button" data-bs-toggle="offcanvas"
                data-bs-target="#mobileMenu" aria-controls="mobileMenu" aria-label="Open navigation menu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Navigation links -->
            <div class="offcanvas-lg offcanvas-start ms-lg-auto" tabindex="-1" id="mobileMenu"
                aria-labelledby="mobileMenuLabel">

                <div class="offcanvas-header">
                    <h5 class="offcanvas-title" id="mobileMenuLabel">
                        Job Application Tracker
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" data-bs-target="#mobileMenu"
                        aria-label="Close menu"></button>
                </div>

                <div class="offcanvas-body">
                    <div class="navbar-nav gap-lg-3">
                        <a class="nav-link px-3 {% if request.endpoint == 'dashboard' %}active bg-body-secondary rounded{% endif %}"
                            href="{{ url_for('dashboard') }}">Dashboard</a>

                        <a class="nav-link px-3 {% if request.endpoint in ['companies', 'company_detail'] %}active bg-body-secondary rounded{% endif %}"
                            href="{{ url_for('companies') }}">Companies</a>

                        <a class="nav-link px-3 {% if request.endpoint in ['jobs', 'job_detail'] %}active bg-body-secondary rounded{% endif %}"
                            href="{{ url_for('jobs') }}">Jobs</a>

                        <a class="nav-link px-3 {% if request.endpoint in ['applications', 'application_detail'] %}active bg-body-secondary rounded{% endif %}"
                            href="{{ url_for('applications') }}">Applications</a>

                        <a class="nav-link px-3 {% if request.endpoint in ['contacts', 'contact_detail'] %}active bg-body-secondary rounded{% endif %}"
                            href="{{ url_for('contacts') }}">Contacts</a>

                        <a class="nav-link px-3 {% if request.endpoint == 'job_match' %}active bg-body-secondary rounded{% endif %}"
                            href="{{ url_for('job_match') }}">Job Match</a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main page content -->
    <main class="container-fluid px-3 px-lg-5 py-4">
        {% block content %}
        {% endblock %}
    </main>

   
    <!-- Sticky horizontal scrollbar for responsive tables -->
    <div id="tableScrollDock" class="table-scroll-dock">
        <div class="table-scroll-label">
            Scroll horizontally to see more columns &rarr;
        </div>

        <div id="tableScrollTrack"
             class="table-scroll-track"
             role="region"
             aria-label="Table horizontal scrolling"
             tabindex="0">
            <div id="tableScrollSpacer" class="table-scroll-spacer"></div>
        </div>
    </div>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Keep the bottom scrollbar synchronized with the table -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const tableContainer = document.querySelector("main .table-responsive");
            const dock = document.getElementById("tableScrollDock");
            const scrollbar = document.getElementById("tableScrollTrack");
            const spacer = document.getElementById("tableScrollSpacer");

            if (!tableContainer) {
                return;
            }

            function updateScrollbar() {
                const needsScrolling =
                    tableContainer.scrollWidth > tableContainer.clientWidth + 2;

                dock.style.display = needsScrolling ? "block" : "none";

                document.body.classList.toggle(
                    "has-horizontal-dock",
                    needsScrolling
                );

                if (needsScrolling) {
                    // Match the table's available horizontal scrolling distance.
                    spacer.style.width = (
                        tableContainer.scrollWidth +
                        scrollbar.clientWidth -
                        tableContainer.clientWidth
                    ) + "px";

                    scrollbar.scrollLeft = tableContainer.scrollLeft;
                }
            }

            // Moving the table also moves the bottom scrollbar.
            tableContainer.addEventListener("scroll", function () {
                if (Math.abs(scrollbar.scrollLeft - tableContainer.scrollLeft) > 1) {
                    scrollbar.scrollLeft = tableContainer.scrollLeft;
                }
            }, { passive: true });

            // Moving the bottom scrollbar also moves the table.
            scrollbar.addEventListener("scroll", function () {
                if (Math.abs(tableContainer.scrollLeft - scrollbar.scrollLeft) > 1) {
                    tableContainer.scrollLeft = scrollbar.scrollLeft;
                }
            }, { passive: true });

            window.addEventListener("resize", updateScrollbar);
            window.addEventListener("load", updateScrollbar);

            // Update if the table size changes.
            if (typeof ResizeObserver !== "undefined") {
                const observer = new ResizeObserver(updateScrollbar);

                observer.observe(tableContainer);

                const table = tableContainer.querySelector("table");

                if (table) {
                    observer.observe(table);
                }
            }

            updateScrollbar();
        });
    </script>
</body>

</html>
